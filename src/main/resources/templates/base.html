<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, activePage)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' | Dev Tracker' : 'Dev Tracker - Tactical DSA Command Center'}">Dev Tracker</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with Forms & Typography Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#ecfeff',
                            100: '#cffafe',
                            200: '#a5f3fc',
                            300: '#67e8f9',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            800: '#155e75',
                            900: '#164e63',
                            950: '#083344',
                        },
                        dark: {
                            bg: '#090d16',
                            surface: '#0f172a',
                            card: '#131d31',
                            subtle: '#1e293b',
                        }
                    }
                }
            }
        };

        // Zero-flash dark mode initialization
        (function() {
            try {
                const storedTheme = localStorage.getItem('dev-tracker-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    
    <!-- Flowbite CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.css" rel="stylesheet">
    
    <!-- Custom Application CSS -->
    <link th:href="@{/css/app.css?v=6}" rel="stylesheet">
    
    <!-- Flowbite & GSAP Scripts -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer th:src="@{/js/app.js?v=6}"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased selection:bg-cyan-500 selection:text-white dark:bg-[#090d16] dark:text-slate-100">
    <!-- Ambient Engineered Grid Background -->
    <div class="relative min-h-screen bg-grid-pattern">
        <!-- Toast Notification Stack -->
        <div th:replace="~{fragments :: toastStack}"></div>

        <!-- Sticky Header Navigation -->
        <header th:replace="~{fragments :: navbar(${activePage})}"></header>

        <!-- Main Workspace Shell -->
        <div class="mx-auto flex max-w-[1536px]">
            <!-- Authenticated Windster Sidebar (Desktop) -->
            <div th:if="${authenticated}">
                <aside th:replace="~{fragments :: sidebar(${activePage})}"></aside>
            </div>

            <!-- Mobile Drawer (Authenticated) -->
            <div th:if="${authenticated}">
                <div th:replace="~{fragments :: mobileDrawer(${activePage})}"></div>
            </div>

            <!-- Core Content Area -->
            <div class="min-w-0 flex-1">
                <!-- Mobile Action Bar for Workspace Navigation -->
                <div th:if="${authenticated}" class="flex items-center justify-between border-b border-slate-200 bg-white/80 px-4 py-2.5 backdrop-blur md:hidden dark:border-slate-800 dark:bg-slate-900/80">
                    <span class="text-xs font-bold uppercase tracking-wider text-cyan-600 dark:text-cyan-400">Tactical Workspace</span>
                    <button data-drawer-target="mobile-sidebar-drawer" data-drawer-show="mobile-sidebar-drawer" aria-controls="mobile-sidebar-drawer" type="button" class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">
                        <span th:replace="~{fragments :: icon('menu', 'h-4 w-4')}"></span>
                        <span>Menu</span>
                    </button>
                </div>

                <!-- Page Content Injected by Child Templates -->
                <div id="page-content" th:insert="${content}"></div>
            </div>
        </div>

        <!-- Public Footer (Only visible on marketing/public pages when logged out) -->
        <footer th:if="${!authenticated}" th:replace="~{fragments :: publicFooter}"></footer>
    </div>
</body>
</html>
