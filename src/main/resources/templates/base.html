<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, activePage)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Dev Tracker'">Dev Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
    <nav class="border-b border-white/10 bg-slate-950/95">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
            <a th:href="@{/devtracker/home}" class="text-xl font-bold tracking-tight">
                Dev Tracker
            </a>

            <div class="flex items-center gap-6 text-sm font-medium text-slate-300">
                <a th:href="@{/devtracker/home}"
                   th:classappend="${activePage == 'home'} ? 'text-white' : 'hover:text-white'">
                    Home
                </a>
                <a th:href="@{/devtracker/about}"
                   th:classappend="${activePage == 'about'} ? 'text-white' : 'hover:text-white'">
                    About
                </a>
                <a th:if="${!authenticated}" th:href="@{/register}" class="hover:text-white">
                    Register
                </a>
                <a th:if="${!authenticated}" th:href="@{/login}" class="hover:text-white">
                    Login
                </a>
                <form th:if="${authenticated}" th:action="@{/logout}" method="post">
                    <button type="submit" class="hover:text-white">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="mx-auto flex max-w-7xl">
        <aside th:if="${authenticated}" class="hidden min-h-[calc(100vh-65px)] w-64 shrink-0 border-r border-white/10 bg-slate-950/80 p-5 md:block">
            <div class="space-y-3">
                <a th:href="@{/devtracker/home}" class="block rounded-lg px-4 py-3 text-sm font-semibold text-slate-300 hover:bg-white/10 hover:text-white">Dashboard</a>
                <a th:href="@{/problems/add}" class="block rounded-lg bg-cyan-400 px-4 py-3 text-sm font-semibold text-slate-950 hover:bg-cyan-300">Add Problem</a>
                <a th:href="@{/problems}" class="block rounded-lg px-4 py-3 text-sm font-semibold text-slate-300 hover:bg-white/10 hover:text-white">My Problems</a>
            </div>
        </aside>

        <div class="min-w-0 flex-1">
            <div th:if="${authenticated}" class="border-b border-white/10 p-4 md:hidden">
                <details class="rounded-lg border border-white/10 bg-white/5 p-3">
                    <summary class="cursor-pointer text-sm font-semibold text-cyan-200">Menu</summary>
                    <div class="mt-3 grid gap-2">
                        <a th:href="@{/devtracker/home}" class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10">Dashboard</a>
                        <a th:href="@{/problems/add}" class="rounded-md bg-cyan-400 px-3 py-2 text-sm font-semibold text-slate-950">Add Problem</a>
                        <a th:href="@{/problems}" class="rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-white/10">My Problems</a>
                    </div>
                </details>
            </div>

            <main th:replace="${content}"></main>
        </div>
    </div>
</body>
</html>
