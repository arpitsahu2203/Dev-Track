<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="navbar(activePage)" class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur"><div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-6"><a th:href="@{/devtracker/home}" class="flex items-center gap-3 font-bold tracking-tight text-slate-950"><span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-500 text-lg text-white shadow-lg shadow-cyan-500/20">D</span><span>Dev Tracker</span></a><button data-collapse-toggle="public-menu" type="button" class="inline-flex rounded-lg p-2 text-slate-600 hover:bg-slate-100 md:hidden" aria-controls="public-menu" aria-expanded="false"><span class="sr-only">Open main menu</span>☰</button><nav id="public-menu" class="hidden w-full items-center gap-1 pt-4 md:flex md:w-auto md:pt-0"><a th:href="@{/devtracker/home}" th:classappend="${activePage == 'home'} ? ' nav-active' : ''" class="nav-link">Home</a><a th:href="@{/devtracker/about}" th:classappend="${activePage == 'about'} ? ' nav-active' : ''" class="nav-link">About</a><a th:href="@{/devtracker/services}" th:classappend="${activePage == 'services'} ? ' nav-active' : ''" class="nav-link">Features</a><a th:href="@{/devtracker/contact}" th:classappend="${activePage == 'contact'} ? ' nav-active' : ''" class="nav-link">Contact</a><button id="theme-toggle" type="button" class="nav-link inline-flex items-center gap-2" aria-label="Switch color theme" aria-pressed="false"><span aria-hidden="true">◐</span><span class="theme-toggle-label">Dark</span></button><span th:if="${!authenticated}" class="my-2 block h-px bg-slate-200 md:mx-2 md:my-0 md:h-6 md:w-px"></span><a th:if="${!authenticated}" th:href="@{/login}" class="nav-link">Sign in</a><a th:if="${!authenticated}" th:href="@{/register}" class="mt-2 block rounded-lg bg-slate-900 px-4 py-2.5 text-center text-sm font-semibold text-white shadow-sm hover:bg-slate-700 md:mt-0">Get started</a><a th:if="${authenticated}" th:href="@{/problems}" class="ml-1 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-600">Open workspace</a><form th:if="${authenticated}" th:action="@{/logout}" method="post" class="md:ml-1"><button type="submit" class="nav-link w-full text-left">Sign out</button></form></nav></div></header>
<aside th:fragment="sidebar(activePage)" class="hidden min-h-[calc(100vh-73px)] w-64 shrink-0 border-r border-slate-200 bg-white p-4 md:block"><p class="px-3 pb-3 text-xs font-bold uppercase tracking-[.16em] text-slate-400">Workspace</p><div th:replace="~{fragments :: sidebarLinks(${activePage})}"></div><div class="mt-8 border-t border-slate-100 pt-4"><p class="px-3 pb-2 text-xs font-bold uppercase tracking-[.16em] text-slate-400">Focus</p><p class="px-3 text-xs leading-5 text-slate-500">Save each solved problem while the approach is still fresh.</p></div></aside><div th:fragment="sidebarLinks(activePage)" class="space-y-1"><a th:href="@{/problems}" th:classappend="${activePage == 'problems'} ? ' side-active' : ''" class="side-link">▦ &nbsp; My problems</a><a th:href="@{/problems/add}" th:classappend="${activePage == 'add'} ? ' side-active' : ''" class="side-link">＋ &nbsp; Add problem</a><a th:href="@{/problems#problem-list}" class="side-link">✦ &nbsp; AI revision</a><div class="my-4 border-t border-slate-100"></div><a th:href="@{/devtracker/services}" class="side-link">◇ &nbsp; How it works</a></div><div th:fragment="alerts" class="space-y-3"><p th:if="${successMessage}" th:text="${successMessage}" class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-800" role="status"></p><p th:if="${errorMessage}" th:text="${errorMessage}" class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-800" role="alert"></p></div>
</body></html>
