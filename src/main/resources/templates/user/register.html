<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{base :: layout(~{::main}, 'register')}">
<body>
<main class="mx-auto max-w-xl px-4 py-12 sm:px-6 lg:px-8">
    <div class="tactical-card p-6 sm:p-8 space-y-6">
        
        <!-- Header -->
        <div class="space-y-1 text-center sm:text-left">
            <span class="font-mono text-[11px] font-bold uppercase tracking-widest text-cyan-600 dark:text-cyan-400">Account Deployment</span>
            <h1 class="font-mono text-2xl font-extrabold text-slate-900 dark:text-white">Create Tactical Workspace</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Start logging problems and unlocking AI revision coaching.</p>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${userForm}" method="post" class="space-y-4">
            
            <!-- Username -->
            <div>
                <label for="name" class="mb-1 block font-mono text-xs font-semibold text-slate-700 dark:text-slate-300">Username / Handle</label>
                <input id="name" type="text" th:field="*{name}" placeholder="e.g. AlgoMaster" required
                       class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs text-slate-900 focus:border-cyan-500 focus:bg-white focus:ring-1 focus:ring-cyan-500 dark:border-slate-800 dark:bg-slate-900 dark:text-white">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 font-mono text-xs text-rose-500"></p>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="mb-1 block font-mono text-xs font-semibold text-slate-700 dark:text-slate-300">Email Address</label>
                <input id="email" type="email" th:field="*{email}" placeholder="you@domain.io" required
                       class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs text-slate-900 focus:border-cyan-500 focus:bg-white focus:ring-1 focus:ring-cyan-500 dark:border-slate-800 dark:bg-slate-900 dark:text-white">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 font-mono text-xs text-rose-500"></p>
            </div>

            <!-- Phone Number -->
            <div>
                <label for="phoneNumber" class="mb-1 block font-mono text-xs font-semibold text-slate-700 dark:text-slate-300">Phone Number (Optional)</label>
                <input id="phoneNumber" type="text" th:field="*{phoneNumber}" placeholder="+1 555 0192"
                       class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs text-slate-900 focus:border-cyan-500 focus:bg-white focus:ring-1 focus:ring-cyan-500 dark:border-slate-800 dark:bg-slate-900 dark:text-white">
                <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="mt-1 font-mono text-xs text-rose-500"></p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="mb-1 block font-mono text-xs font-semibold text-slate-700 dark:text-slate-300">Password</label>
                <input id="password" type="password" th:field="*{password}" required
                       class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs text-slate-900 focus:border-cyan-500 focus:bg-white focus:ring-1 focus:ring-cyan-500 dark:border-slate-800 dark:bg-slate-900 dark:text-white">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 font-mono text-xs text-rose-500"></p>
            </div>

            <button type="submit" 
                    class="w-full rounded-xl bg-gradient-to-r from-cyan-500 to-cyan-600 py-2.5 font-mono text-xs font-bold text-slate-950 shadow-md shadow-cyan-500/20 transition hover:from-cyan-400 hover:to-cyan-500">
                Deploy My Workspace
            </button>
        </form>

        <!-- OAuth Divider -->
        <div class="flex items-center gap-3 font-mono text-[10px] text-slate-400">
            <span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span>
            <span>OR SIGN UP WITH</span>
            <span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span>
        </div>

        <!-- OAuth Action Buttons -->
        <div class="grid gap-2.5">
            <a th:href="@{/oauth2/authorization/google}" 
               class="flex items-center justify-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
                <span th:replace="~{fragments :: icon('google', 'h-4 w-4')}"></span>
                <span>Continue with Google</span>
            </a>
            <a th:href="@{/oauth2/authorization/github}" 
               class="flex items-center justify-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
                <span th:replace="~{fragments :: icon('github', 'h-4 w-4')}"></span>
                <span>Continue with GitHub</span>
            </a>
        </div>

        <!-- Sign In Link -->
        <div class="text-center font-mono text-xs text-slate-500 dark:text-slate-400">
            <span>Already have an account?</span>
            <a th:href="@{/login}" class="font-bold text-cyan-600 hover:underline dark:text-cyan-400"> Sign in</a>
        </div>

    </div>
</main>
</body>
</html>
