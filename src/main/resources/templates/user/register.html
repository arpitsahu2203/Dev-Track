<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::main}, 'register')}">
<body>
<main class="mx-auto max-w-3xl px-6 py-12">
    <section class="rounded-2xl border border-white/10 bg-white/5 p-8">
        <p class="text-sm font-semibold uppercase tracking-[0.25em] text-cyan-300">Create Account</p>
        <h1 class="mt-3 text-3xl font-bold">Start tracking your DSA journey.</h1>

        <form th:action="@{/register}" th:object="${userForm}" method="post" class="mt-8 space-y-5">
            <div>
                <label for="name" class="mb-2 block text-sm font-medium text-slate-200">Username</label>
                <input id="name" type="text" th:field="*{name}" class="w-full rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none focus:border-cyan-300">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-2 text-sm text-rose-300"></p>
            </div>

            <div>
                <label for="email" class="mb-2 block text-sm font-medium text-slate-200">Email</label>
                <input id="email" type="email" th:field="*{email}" class="w-full rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none focus:border-cyan-300">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-2 text-sm text-rose-300"></p>
            </div>

            <div>
                <label for="phoneNumber" class="mb-2 block text-sm font-medium text-slate-200">Phone Number</label>
                <input id="phoneNumber" type="text" th:field="*{phoneNumber}" class="w-full rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none focus:border-cyan-300">
                <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="mt-2 text-sm text-rose-300"></p>
            </div>

            <div>
                <label for="password" class="mb-2 block text-sm font-medium text-slate-200">Password</label>
                <input id="password" type="password" th:field="*{password}" class="w-full rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none focus:border-cyan-300">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-2 text-sm text-rose-300"></p>
            </div>

            <button type="submit" class="w-full rounded-lg bg-cyan-400 px-5 py-3 font-semibold text-slate-950 hover:bg-cyan-300">Register</button>
        </form>

        <div class="my-8 flex items-center gap-4">
            <div class="h-px flex-1 bg-white/10"></div>
            <span class="text-sm text-slate-400">or sign up with</span>
            <div class="h-px flex-1 bg-white/10"></div>
        </div>

        <div class="grid gap-3 sm:grid-cols-2">
            <a th:href="@{/oauth2/authorization/google}" class="rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-center font-semibold text-white hover:bg-white/10">
                Google
            </a>
            <a th:href="@{/oauth2/authorization/github}" class="rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-center font-semibold text-white hover:bg-white/10">
                GitHub
            </a>
        </div>
    </section>
</main>
</body>
</html>
