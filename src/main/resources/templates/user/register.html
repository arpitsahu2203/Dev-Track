<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main}, 'register')}"><body><main class="mx-auto max-w-xl px-6 py-14"><section class="reveal surface p-6 sm:p-8"><p class="text-sm font-bold uppercase tracking-[.2em] text-brand-600">Create account</p><h1 class="mt-3 text-3xl font-bold">Start tracking with intention.</h1><p class="mt-2 text-slate-600">Build a clean record for every step of your DSA journey.</p><form th:action="@{/register}" th:object="${userForm}" method="post" class="mt-7 space-y-5"><div><label for="name" class="mb-2 block text-sm font-semibold">Username</label><input id="name" type="text" th:field="*{name}" class="field"><p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-2 text-sm text-rose-600"></p></div><div><label for="email" class="mb-2 block text-sm font-semibold">Email</label><input id="email" type="email" th:field="*{email}" class="field"><p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-2 text-sm text-rose-600"></p></div><div><label for="phoneNumber" class="mb-2 block text-sm font-semibold">Phone number</label><input id="phoneNumber" type="text" th:field="*{phoneNumber}" class="field"><p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="mt-2 text-sm text-rose-600"></p></div><div><label for="password" class="mb-2 block text-sm font-semibold">Password</label><input id="password" type="password" th:field="*{password}" class="field"><p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-2 text-sm text-rose-600"></p></div><button type="submit" class="w-full rounded-xl bg-brand-500 px-5 py-3 font-bold text-white hover:bg-brand-600">Create account</button></form><div class="my-6 flex items-center gap-3 text-xs text-slate-400"><span class="h-px flex-1 bg-slate-200"></span>OR SIGN UP WITH<span class="h-px flex-1 bg-slate-200"></span></div><div class="grid gap-3"><a th:href="@{/oauth2/authorization/google}" class="oauth-button"><svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5"><path fill="#4285F4" d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.5h3.2c1.9-1.8 3.1-4.4 3.1-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2 .9-3.5.9-2.7 0-5-1.8-5.8-4.3H2.9v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.2 13.7a6 6 0 0 1 0-3.4V7.7H2.9a10 10 0 0 0 0 8.6l3.3-2.6Z"/><path fill="#EA4335" d="M12 6c1.6 0 3 .5 4.1 1.6l3.1-3A10 10 0 0 0 2.9 7.7l3.3 2.6C7 7.8 9.3 6 12 6Z"/></svg>Continue with Google</a><a th:href="@{/oauth2/authorization/github}" class="oauth-button"><span aria-hidden="true">◉</span>Continue with GitHub</a></div></section></main></body></html>
