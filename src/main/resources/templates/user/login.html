<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::main}, 'login')}">
<body>
<main class="mx-auto max-w-xl px-6 py-12">
    <section class="rounded-2xl border border-white/10 bg-white/5 p-8">
        <p class="text-sm font-semibold uppercase tracking-[0.25em] text-cyan-300">Welcome Back</p>
        <h1 class="mt-3 text-3xl font-bold">Login to your tracker.</h1>

        <p th:if="${param.error}" class="mt-6 rounded-lg border border-rose-400/20 bg-rose-400/10 px-4 py-3 text-sm text-rose-200">Invalid email or password.</p>
        <p th:if="${param.oauthError}" class="mt-6 rounded-lg border border-rose-400/20 bg-rose-400/10 px-4 py-3 text-sm text-rose-200">OAuth login failed. Please try again.</p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="mt-6 rounded-lg border border-rose-400/20 bg-rose-400/10 px-4 py-3 text-sm text-rose-200"></p>
        <p th:if="${param.logout}" class="mt-6 rounded-lg border border-emerald-400/20 bg-emerald-400/10 px-4 py-3 text-sm text-emerald-200">You have been logged out.</p>
        <p th:if="${successMessage}" th:text="${successMessage}" class="mt-6 rounded-lg border border-emerald-400/20 bg-emerald-400/10 px-4 py-3 text-sm text-emerald-200"></p>

        <form th:action="@{/login}" th:object="${loginForm}" method="post" class="mt-8 space-y-5">
            <div>
                <label for="email" class="mb-2 block text-sm font-medium text-slate-200">Email</label>
                <input id="email" type="email" th:field="*{email}" class="w-full rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none focus:border-cyan-300">
            </div>

            <div>
                <label for="password" class="mb-2 block text-sm font-medium text-slate-200">Password</label>
                <input id="password" type="password" th:field="*{password}" class="w-full rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none focus:border-cyan-300">
            </div>

            <button type="submit" class="w-full rounded-lg bg-cyan-400 px-5 py-3 font-semibold text-slate-950 hover:bg-cyan-300">Login</button>
        </form>

        <div class="my-8 flex items-center gap-4">
            <div class="h-px flex-1 bg-white/10"></div>
            <span class="text-sm text-slate-400">or continue with</span>
            <div class="h-px flex-1 bg-white/10"></div>
        </div>

        <div class="grid gap-3 sm:grid-cols-2">
            <a th:href="@{/oauth2/authorization/google}" class="rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-center font-semibold text-white hover:bg-white/10">
                Google
            </a>
            <a th:href="@{/oauth2/authorization/github}" class="rounded-lg border border-white/10 bg-slate-950 px-4 py-3 text-center font-semibold text-white hover:bg-white/10">
                GitHub
            </a>
        </div>
    </section>
</main>
</body>
</html>
